<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">AprovA</title>
//fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style id="dynamicStyles"></style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwEXgYi_e--O9oqmUifLVxIaqrq3ZMUOc",
  authDomain: "aprovai-34e6d.firebaseapp.com",
  projectId: "aprovai-34e6d",
  storageBucket: "aprovai-34e6d.firebasestorage.app",
  messagingSenderId: "1021333850436",
  appId: "1:1021333850436:web:8e631984e5a75f93e2ef11",
  databaseURL: "https://aprovai-34e6d-default-rtdb.firebaseio.com"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

async function getData(key) {
  try { const s = await get(child(ref(db), key.replace(/\//g,"_"))); return s.exists() ? s.val() : null; }
  catch(e) { return null; }
}
async function saveData(key, data) {
  await set(ref(db, key.replace(/\//g,"_")), data);
}

const CLIENTS = {
  adara:  {id:"adara",  name:"Instituto Adara",    area:"Centro de Saúde Integrada", prazo:"20 mar", color:"#b08fd4", colorDim:"rgba(176,143,212,.12)", icon:"IA"},
  renato: {id:"renato", name:"Dr. Renato Andrade", area:"Nutrologia",                prazo:"22 mar", color:"#7aafd4", colorDim:"rgba(122,175,212,.12)", icon:"DR"},
  cesar:  {id:"cesar",  name:"Dr. César Prota",    area:"Ortopedia",                 prazo:"25 mar", color:"#7ac4a0", colorDim:"rgba(122,196,160,.12)", icon:"CP"},
  hir:    {id:"hir",    name:"HIR Marketing",      area:"Marketing & Estratégia",    prazo:"30 mar", color:"#d4956a", colorDim:"rgba(212,149,106,.12)", icon:"HM"}
};

const params   = new URLSearchParams(window.location.search);
const view     = params.get("v") || "dashboard";
const clientId = params.get("c");

(async () => {
  if (view==="dashboard")                        await renderDashboard();
  else if (view==="admin"  && CLIENTS[clientId]) await renderAdmin(CLIENTS[clientId]);
  else if (view==="client" && CLIENTS[clientId]) await renderClient(CLIENTS[clientId]);
  else document.getElementById("app").innerHTML = `<div style="padding:40px;text-align:center;font-family:sans-serif"><h1>404</h1><p>Página não encontrada</p><a href="?v=dashboard">Voltar</a></div>`;
})();

// ─── DASHBOARD ───────────────────────────────────────────────
async function renderDashboard() {
  document.getElementById("pageTitle").textContent = "AprovA — Dashboard";
  document.getElementById("app").innerHTML = `<div style="padding:60px;text-align:center;font-family:sans-serif;color:#f0eff8">Carregando...</div>`;
  document.getElementById("dynamicStyles").textContent = `
    *{margin:0;padding:0;box-sizing:border-box} html{scroll-behavior:smooth}
    body{font-family:'Space Grotesk',sans-serif;background:#0c0c0f;color:#f0eff8;min-height:100vh;overflow-x:hidden}
    header{padding:0 52px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:rgba(12,12,15,.8);backdrop-filter:blur(20px);border-bottom:1px solid #26262f}
    .logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.02em}
    .logo em{background:linear-gradient(90deg,#c084fc,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-style:normal}
    .badge{background:rgba(255,255,255,.04);border:1px solid #23232e;padding:6px 14px;border-radius:999px;color:#7a7a8a;font-size:12px;font-weight:500;letter-spacing:.04em}
    .badge-dot{width:6px;height:6px;border-radius:50%;background:#34d399;display:inline-block;margin-right:6px;box-shadow:0 0 6px #34d399}
    .hero{padding:72px 52px 48px;position:relative;z-index:1}
    .h-eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#c084fc;margin-bottom:20px;display:flex;align-items:center;gap:8px}
    .h-eyebrow:before{content:"";width:24px;height:1px;background:#c084fc;opacity:.6}
    .h-title{font-family:'Syne',sans-serif;font-size:58px;font-weight:800;line-height:1.0;letter-spacing:-.03em;margin-bottom:14px}
    .h-title .gr{background:linear-gradient(135deg,#c084fc 0,#818cf8 50%,#34d399 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .h-sub{font-size:15px;color:#7a7a8a;max-width:440px;line-height:1.7;font-weight:300}
    .stats{padding:0 52px 40px;display:flex;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
    .stat{background:#18181f;border:1px solid #26262f;border-radius:14px;padding:16px 24px;display:flex;align-items:center;gap:14px;min-width:160px}
    .stat-icon{font-size:22px} .stat-val{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;line-height:1}
    .stat-lbl{font-size:11px;color:#7a7a8a;margin-top:3px;font-weight:400}
    .sec-label{padding:0 52px 16px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#5a5a68;position:relative;z-index:1;display:flex;align-items:center;gap:10px}
    .sec-label:after{content:"";flex:1;height:1px;background:#26262f}
    .grid{padding:0 52px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;position:relative;z-index:1}
    .cc{background:#18181f;border:1px solid #26262f;border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;position:relative;cursor:pointer}
    .cc:hover{transform:translateY(-5px) scale(1.01);box-shadow:0 24px 60px rgba(0,0,0,.4)}
    .cc-glow{position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;opacity:0;transition:opacity .4s;pointer-events:none;filter:blur(40px)}
    .cc:hover .cc-glow{opacity:1}
    .cc-stripe{height:3px;width:100%} .cc-top{padding:28px 28px 22px;flex:1}
    .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:20px;border:1px solid rgba(255,255,255,.08)}
    .cname{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;line-height:1.2;margin-bottom:4px;letter-spacing:-.02em}
    .carea{font-size:12px;color:#7a7a8a;margin-bottom:18px;font-weight:400}
    .sb{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;margin-bottom:12px}
    .sb:before{content:"";width:5px;height:5px;border-radius:50%;flex-shrink:0}
    .sb-empty{background:rgba(255,255,255,.04);color:#7a7a8a;border:1px solid #26262f} .sb-empty:before{background:#7a7a8a}
    .sb-draft{background:rgba(224,160,48,.1);color:#e0a030;border:1px solid rgba(224,160,48,.2)} .sb-draft:before{background:#e0a030;box-shadow:0 0 6px #e0a030}
    .sb-sent{background:rgba(61,186,114,.1);color:#3dba72;border:1px solid rgba(61,186,114,.2)} .sb-sent:before{background:#3dba72;box-shadow:0 0 6px #3dba72}
    .count-badge{font-size:12px;color:#7a7a8a;background:rgba(255,255,255,.04);padding:5px 10px;border-radius:8px;border:1px solid #26262f;display:inline-block}
    .prazo-chip{font-size:10px;color:#5a5a68;display:flex;align-items:center;gap:4px;margin-top:8px}
    .cc-bot{padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #26262f}
    .btn-link{padding:8px 16px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s;border:none;letter-spacing:.02em}
    .btn-edit{background:linear-gradient(135deg,#c084fc,#818cf8);color:#fff}
    .btn-edit:hover{filter:brightness(1.15);transform:translateY(-1px)}
    .btn-view{background:rgba(255,255,255,.06);color:#7a7a8a;border:1px solid #26262f}
    .btn-view:hover{background:rgba(255,255,255,.1);color:#f0eff8}
    @media(max-width:900px){header,.hero,.stats,.sec-label,.grid{padding-left:20px;padding-right:20px} .h-title{font-size:38px}}
  `;

  let totalClients=0,totalPecas=0,totalRespondidos=0,totalPendentes=0,cardsHtml="";
  for (const c of Object.values(CLIENTS)) {
    totalClients++;
    const content  = await getData(`content_${c.id}`) || [];
    const approval = await getData(`aprovai_${c.id}`);
    totalPecas += content.length;
    let statusBadge,statusCls;
    if (!content.length)          {statusBadge="Sem conteúdo";       statusCls="sb-empty"; totalPendentes++;}
    else if (approval?.submitted) {statusBadge="Cliente respondeu";  statusCls="sb-sent";  totalRespondidos++;}
    else                          {statusBadge="Pronto para enviar"; statusCls="sb-draft"; totalPendentes++;}
    cardsHtml += `
    <div class="cc">
      <div class="cc-glow" style="background:${c.color}"></div>
      <div class="cc-stripe" style="background:linear-gradient(90deg,${c.color},${c.color}55)"></div>
      <div class="cc-top">
        <div class="ic" style="background:${c.colorDim};color:${c.color}">${c.icon}</div>
        <div class="cname">${c.name}</div><div class="carea">${c.area}</div>
        <div class="sb ${statusCls}">${statusBadge}</div>
        <div class="count-badge">${content.length} ${content.length===1?"peça":"peças"}</div>
        <div class="prazo-chip">⏱ Prazo ${c.prazo}</div>
      </div>
      <div class="cc-bot">
        <a class="btn-link btn-edit" href="?v=admin&c=${c.id}">Editar</a>
        <a class="btn-link btn-view" href="?v=client&c=${c.id}" target="_blank">Ver painel</a>
      </div>
    </div>`;
  }
  document.getElementById("app").innerHTML = `
  <header><div class="logo">Aprovem<em>A</em></div><div class="badge"><span class="badge-dot"></span>Social Media</div></header>
  <div class="hero"><div class="h-eyebrow">Painel de Gestão</div>
    <div class="h-title">Seus <span class="gr">clientes,</span><br>organizados.</div>
    <div class="h-sub">Crie conteúdos, envie para aprovação e acompanhe as respostas em tempo real.</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-icon">👥</div><div><div class="stat-val">${totalClients}</div><div class="stat-lbl">Clientes ativos</div></div></div>
    <div class="stat"><div class="stat-icon">🗂</div><div><div class="stat-val">${totalPecas}</div><div class="stat-lbl">Peças criadas</div></div></div>
    <div class="stat"><div class="stat-icon">✅</div><div><div class="stat-val">${totalRespondidos}</div><div class="stat-lbl">Respostas recebidas</div></div></div>
    <div class="stat"><div class="stat-icon">⏳</div><div><div class="stat-val">${totalPendentes}</div><div class="stat-lbl">Aguardando</div></div></div>
  </div>
  <div class="sec-label">Clientes</div>
  <div class="grid">${cardsHtml}</div>`;
}

// ─── ADMIN ───────────────────────────────────────────────────
async function renderAdmin(client) {
  document.getElementById("pageTitle").textContent = `Editar — ${client.name}`;
  document.getElementById("app").innerHTML = `<div style="padding:60px;text-align:center;color:#f0eff8">Carregando...</div>`;
  document.getElementById("dynamicStyles").textContent = `
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Space Grotesk',sans-serif;background:#0c0c0f;color:#f0eff8;min-height:100vh}
    :root{--bg:#0c0c0f;--ink:#f0eff8;--s:#18181f;--b:#26262f;--b2:#23232e;--m:#7a7a8a;--acc:${client.color};--acc-dim:${client.colorDim}}
    header{background:rgba(12,12,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:0 44px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--m);text-decoration:none;transition:color .2s;font-weight:500}
    .back:hover{color:var(--ink)}
    .h-client{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--ink)}
    .save-btn{padding:8px 20px;background:var(--acc);border:none;border-radius:8px;font-size:13px;font-weight:600;color:#0c0c0f;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif}
    .save-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
    .hero{padding:40px 44px 32px;position:relative;z-index:1;border-bottom:1px solid var(--b)}
    .hero-eyebrow{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .hero-eyebrow:before{content:"";width:20px;height:1px;background:var(--acc);opacity:.6}
    .hero-title{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
    .hero-sub{font-size:14px;color:var(--m);font-weight:300}
    .content{padding:24px 44px 120px;position:relative;z-index:1}
    .add-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;background:transparent;border:1px dashed var(--b2);border-radius:10px;font-size:13px;font-weight:500;color:var(--m);cursor:pointer;transition:all .2s;margin-bottom:24px;font-family:'Space Grotesk',sans-serif}
    .add-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-dim)}
    .items{display:flex;flex-direction:column;gap:16px}
    .item{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:22px 26px}
    .item-header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .type-select{padding:6px 12px;border-radius:8px;border:1px solid var(--b);font-size:13px;font-weight:600;background:var(--bg);color:var(--ink);cursor:pointer;font-family:'Space Grotesk',sans-serif}
    .del-btn{margin-left:auto;padding:6px 12px;background:rgba(224,85,85,.1);color:#e05555;border:1px solid rgba(224,85,85,.2);border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif}
    .del-btn:hover{background:#e05555;color:#fff;border-color:#e05555}
    .field{margin-bottom:16px}
    .label{font-size:10px;font-weight:600;color:var(--m);margin-bottom:7px;text-transform:uppercase;letter-spacing:.1em;display:block}
    input,textarea{width:100%;padding:10px 14px;border:1px solid var(--b);border-radius:8px;font-size:14px;font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--ink);transition:border-color .2s}
    input:focus,textarea:focus{outline:none;border-color:var(--acc)}
    textarea{resize:vertical;min-height:100px;line-height:1.7}
    .hint{font-size:11px;color:var(--m);margin-top:5px}
    .fixed-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(12,12,15,.95);backdrop-filter:blur(20px);border-top:1px solid var(--b);padding:14px 44px;display:flex;align-items:center;justify-content:space-between;z-index:200}
    .bar-info{font-size:14px;color:var(--m)} .bar-info strong{color:var(--ink)}
    .bar-actions{display:flex;gap:10px}
    .btn{padding:10px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;border:none;font-family:'Space Grotesk',sans-serif}
    .btn-save{background:var(--acc);color:#0c0c0f} .btn-save:hover{filter:brightness(1.1);transform:translateY(-1px)}
    .btn-link{background:var(--s);color:var(--ink);border:1px solid var(--b);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .btn-link:hover{border-color:var(--acc);color:var(--acc)}
    @media(max-width:600px){header,.hero,.content,.fixed-bar{padding-left:20px;padding-right:20px}}
  `;

  const contentKey = `content_${client.id}`;
  let content = await getData(contentKey) || [];
  window._adminUploads = {};

  // carrega uploads já salvos
  const existingApproval = await getData(`aprovai_${client.id}`);
  if (existingApproval?.uploads) window._adminUploads = existingApproval.uploads;

  function renderUploadSection(idx, item) {
    const i = idx + 1;
    if (item.type==="post"||item.type==="reels"||item.type==="stories") {
      const u = window._adminUploads[i];
      return `<div class="field">abel class="label">${item.type==="reels"?"Vídeo":"Imagem/Vídeo"}</label>
        ${u ? `<div style="border:1px solid var(--b);border-radius:8px;padding:10px;background:var(--bg)">
          ${u.type.startsWith("video")?`<video src="${u.dataUrl}" controls style="max-width:200px;max-height:200px;border-radius:6px"></video>`:`<img src="${u.dataUrl}" style="max-width:200px;max-height:200px;object-fit:cover;border-radius:6px">`}
          <button class="del-btn" style="margin-left:10px" onclick="window.removeAdminUpload(${i})">Remover</button>
        </div>` : ""}
        <input type="file" accept="${item.type==="reels"?"video/*":"image/*,video/*"}" onchange="window.handleAdminUpload(${i},this)">
        <div class="hint">Máximo 10MB</div></div>`;
    } else if (item.type==="carousel") {
      const slides = item.slides||5;
      let h = `<div class="field">abel class="label">Slides do Carrossel</label><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px">`;
      for (let j=1;j<=slides;j++) {
        const sk=`${i}_${j}`, hs=window._adminUploads[sk];
        h += `<div style="border:1px solid var(--b);border-radius:8px;padding:8px;background:var(--bg)">
          <div style="font-size:11px;font-weight:600;margin-bottom:6px;color:var(--m)">Slide ${j}</div>
          ${hs?`<img src="${hs.dataUrl}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;margin-bottom:6px"><button class="del-btn" style="width:100%;font-size:11px;padding:4px" onclick="window.removeAdminUpload('${sk}')">Remover</button>`:""}
          <input type="file" accept="image/*,video/*" onchange="window.handleAdminUpload('${sk}',this)" style="width:100%;font-size:11px">
        </div>`;
      }
      h += `</div></div>`;
      return h;
    }
    return "";
  }

  function render() {
    const itemsHtml = content.map((item,i) => `
    <div class="item">
      <div class="item-header">
        <select class="type-select" onchange="window.updateType(${i},this.value)">
          <option value="post"     ${item.type==="post"     ?"selected":""}>Post</option>
          <option value="carousel" ${item.type==="carousel" ?"selected":""}>Carrossel</option>
          <option value="reels"    ${item.type==="reels"    ?"selected":""}>Reels</option>
          <option value="stories"  ${item.type==="stories"  ?"selected":""}>Stories</option>
        </select>
        <span style="font-size:12px;color:var(--m)">#${i+1}</span>
        <button class="del-btn" onclick="window.deleteItem(${i})">Excluir</button>
      </div>
      <div class="field">abel class="label">Título</label>
        <input type="text" value="${(item.title||"").replace(/"/g,"&quot;")}" onchange="window.updateField(${i},'title',this.value)">
      </div>
      <div class="field">abel class="label">Data de publicação</label>
        <input type="text" value="${(item.date||"").replace(/"/g,"&quot;")}" placeholder="Ex: 18 mar" onchange="window.updateField(${i},'date',this.value)">
      </div>
      <div class="field">abel class="label">Copy / Roteiro</label>
        <textarea onchange="window.updateField(${i},'copy',this.value)">${item.copy||""}</textarea>
      </div>
      ${(item.type==="post"||item.type==="stories")?`
      <div class="field">abel class="label">Hashtags (separadas por vírgula)</label>
        <input type="text" value="${((item.tags||[]).join(", ")).replace(/"/g,"&quot;")}" onchange="window.updateTags(${i},this.value)">
        <div class="hint">Ex: Cliente, Marca, Tema</div>
      </div>`:""}
      ${item.type==="carousel"?`
      <div class="field">abel class="label">Número de slides</label>
        <input type="number" min="2" max="10" value="${item.slides||5}" onchange="window.updateField(${i},'slides',parseInt(this.value))">
      </div>`:""}
      ${renderUploadSection(i, item)}
    </div>`).join("");

    document.getElementById("app").innerHTML = `
    <header>
      <a class="back" href="?v=dashboard">← Dashboard</a>
      <div class="h-client">${client.name}</div>
      <button class="save-btn" onclick="window.saveContent()">Salvar</button>
    </header>
    <div class="hero">
      <div class="hero-eyebrow">Modo Admin</div>
      <div class="hero-title">Editar Conteúdo</div>
      <div class="hero-sub">Crie e organize as peças que serão enviadas para aprovação.</div>
    </div>
    <div class="content">
      <button class="add-btn" onclick="window.addItem()">+ Adicionar nova peça</button>
      <div class="items">${itemsHtml}</div>
    </div>
    <div class="fixed-bar">
      <div class="bar-info"><strong>${content.length}</strong> ${content.length===1?"peça criada":"peças criadas"}</div>
      <div class="bar-actions">
        <button class="btn btn-save" onclick="window.saveContent()">Salvar alterações</button>
        <a class="btn btn-link" href="?v=client&c=${client.id}" target="_blank">Ver painel do cliente</a>
      </div>
    </div>`;
  }

  window.handleAdminUpload = (id, input) => {
    const file = input.files
    ];
    if (!file) return;
    if (file.size > 10*1024*1024) { alert("Arquivo muito grande! Máximo 10MB."); return; }
    const reader = new FileReader();
    reader.onload = e => {
      window._adminUploads[id] = { dataUrl: e.target.result, filename: file.name, type: file.type, size: file.size };
      render();
    };
    reader.readAsDataURL(file);
  };

  window.removeAdminUpload = (id) => {
    if (confirm("Remover este arquivo?")) { delete window._adminUploads[id]; render(); }
  };
  window.addItem    = () => { content.push({type:"post",title:"",date:"",copy:"",tags:[]}); render(); };
  window.deleteItem = (idx) => { if (confirm("Excluir esta peça?")) { content.splice(idx,1); render(); } };
  window.updateType = (idx,type) => { content[idx].type=type; if(type==="carousel"&&!content[idx].slides) content[idx].slides=5; render(); };
  window.updateField= (idx,f,v) => { content[idx][f]=v; };
  window.updateTags = (idx,val) => { content[idx].tags=val.split(",").map(t=>t.trim()).filter(Boolean); };
  window.saveContent= async () => {
    await saveData(contentKey, content);
    const ap = await getData(`aprovai_${client.id}`) || {};
    ap.uploads = window._adminUploads;
    await saveData(`aprovai_${client.id}`, ap);
    alert("Conteúdo salvo!");
    render();
  };

  render();
}

      window._adminUploads[id] = { dataUrl: e.target.result, filename: file.name, type: file.type, size: file.size };
      render();
    };
    reader.readAsDataURL(file);
  };

  window.removeAdminUpload = (id) => {
    if (confirm("Remover este arquivo?")) { delete window._adminUploads[id]; render(); }
  };
  window.addItem    = () => { content.push({type:"post",title:"",date:"",copy:"",tags:[]}); render(); };
  window.deleteItem = (idx) => { if (confirm("Excluir esta peça?")) { content.splice(idx,1); render(); } };
  window.updateType = (idx,type) => { content[idx].type=type; if(type==="carousel"&&!content[idx].slides) content[idx].slides=5; render(); };
  window.updateField= (idx,f,v) => { content[idx][f]=v; };
  window.updateTags = (idx,val) => { content[idx].tags=val.split(",").map(t=>t.trim()).filter(Boolean); };
  window.saveContent= async () => {
    await saveData(contentKey, content);
    const ap = await getData(`aprovai_${client.id}`) || {};
    ap.uploads = window._adminUploads;
    await saveData(`aprovai_${client.id}`, ap);
    alert("Conteúdo salvo!");
    render();
  };

  render();
}

      const id = this.id.replace("cm","");

  async function persist() {
