t-size:13px;font-weight:600;background:var(--bg);color:var(--ink);cursor:pointer;font-family:'Space Grotesk',sans-serif}.del-btn{margin-left:auto;padding:6px 12px;background:rgba(224,85,85,.1);color:#e05555;border:1px solid rgba(224,85,85,.2);border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif}.del-btn:hover{background:#e05555;color:#fff;border-color:#e05555}.field{margin-bottom:16px}.label{font-size:10px;font-weight:600;color:var(--m);margin-bottom:7px;text-transform:uppercase;letter-spacing:.1em;display:block}input,textarea{width:100%;padding:10px 14px;border:1px solid var(--b);border-radius:8px;font-size:14px;font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--ink);transition:border-color .2s}input:focus,textarea:focus{outline:none;border-color:var(--acc)}textarea{resize:vertical;min-height:100px;line-height:1.7}.hint{font-size:11px;color:var(--m);margin-top:5px}.fixed-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(12,12,15,.95);backdrop-filter:blur(20px);border-top:1px solid var(--b);padding:14px 44px;display:flex;align-items:center;justify-content:space-between;z-index:200}.bar-info{font-size:14px;color:var(--m)}.bar-info strong{color:var(--ink)}.bar-actions{display:flex;gap:10px}.btn{padding:10px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;border:none;font-family:'Space Grotesk',sans-serif}.btn-save{background:var(--acc);color:#0c0c0f}.btn-link{background:var(--s);color:var(--ink);border:1px solid var(--b);text-decoration:none;display:inline-flex;align-items:center;gap:6px}.btn-link:hover{border-color:var(--acc);color:var(--acc)}@media(max-width:600px){header,.hero,.content,.fixed-bar{padding-left:20px;padding-right:20px}}`;

function renderUploadSection(idx,item){
const i=idx+1;
if(item.type==="post"||item.type==="reels"||item.type==="stories"){
const u=window._adminUploads[i];
return `<div class="field"><label class="label">${item.type==="reels"?"Vídeo":"Imagem/Vídeo"}</label>${u?`<div style="border:1px solid var(--b);border-radius:8px;padding:10px;background:var(--bg);margin-bottom:8px">${u.type.startsWith("video")?`<video src="${u.dataUrl}" controls style="max-width:200px;max-height:200px;border-radius:6px"></video>`:`<img src="${u.dataUrl}" style="max-width:200px;max-height:200px;object-fit:cover;border-radius:6px">`}<button class="del-btn" style="margin-left:10px" onclick="window.removeAdminUpload(${i})">Remover</button></div>`:""}<input type="file" accept="${item.type==="reels"?"video/*":"image/*,video/*"}" onchange="window.handleAdminUpload(${i},this)"><div class="hint">Máximo 10MB</div></div>`;
}else if(item.type==="carousel"){

h+=`</div></div>`;return h;
}return "";}
function render(){
const itemsHtml=content.map((item,i)=>`
<div class="item"><div class="item-header"><select class="type-select" onchange="window.updateType(${i},this.value)"><option value="post" ${item.type==="post"?"selected":""}>Post</option><option value="carousel" ${item.type==="carousel"?"selected":""}>Carrossel</option><option value="reels" ${item.type==="reels"?"selected":""}>Reels</option><option value="stories" ${item.type==="stories"?"selected":""}>Stories</option></select><span style="font-size:12px;color:var(--m)">#${i+1}</span><button class="del-btn" onclick="window.deleteItem(${i})">Excluir</button></div>
<div class="field"><label class="label">Título</label><input type="text" value="${(item.title||"").replace(/"/g,"&quot;")}" onchange="window.updateField(${i},'title',this.value)"></div>
<div class="field"><label class="label">Data de publicação</label><input type="text" value="${(item.date||"").replace(/"/g,"&quot;")}" placeholder="Ex: 18 mar" onchange="window.updateField(${i},'date',this.value)"></div>
<div class="field"><label class="label">Copy / Roteiro</label><textarea onchange="window.updateField(${i},'copy',this.value)">${item.copy||""}</textarea></div>
${(item.type==="post"||item.type==="stories")?`<div class="field"><label class="label">Hashtags (separadas por vírgula)</label><input type="text" value="${((item.tags||[]).join(", ")).replace(/"/g,"&quot;")}" onchange="window.updateTags(${i},this.value)"><div class="hint">Ex: Cliente, Marca, Tema</div></div>":""}
${item.type==="carousel"?`<div class="field"><label class="label">Número de slides</label><input type="number" min="2" max="10" value="${item.slides||5}" onchange="window.updateField(${i},'slides',parseInt(this.value))"></div>":""}
${renderUploadSection(i,item)}</div>`).join("");
document.getElementById("app").innerHTML=`<header><a class="back" href="?v=dashboard">← Dashboard</a><div class="h-client">${client.name}</div><button class="save-btn" onclick="window.saveContent()">Salvar</button></header><div class="hero"><div class="hero-eyebrow">Modo Admin</div><div class="hero-title">Editar Conteúdo</div><div class="hero-sub">Crie e organize as peças que serão enviadas para aprovação.</div></div><div class="content"><button class="add-btn" onclick="window.addItem()">+ Adicionar nova peça</button><div class="items">${itemsHtml}</div></div><div class="fixed-bar"><div class="bar-info"><strong>${content.length}</strong> ${content.length===1?"peça criada":"peças criadas"}</div><div class="bar-actions"><button class="btn btn-save" onclick="window.saveContent()">Salvar alterações</button><a class="btn btn-link" href="?v=client&c=${client.id}" target="_blank">Ver painel do cliente</a></div></div>`;}
window.handleAdminUpload=(id,input)=>{const file=input.files[0];if(!file)return;if(file.size>10*1024*1024){alert("Arquivo muito grande! Máximo 10MB.");return;}const reader=new FileReader();reader.onload=e=>{window._adminUploads[id]={dataUrl:e.target.result,filename:file.name,type:file.type,size:file.size};render();};reader.readAsDataURL(file);};
window.removeAdminUpload=(id)=>{if(confirm("Remover este arquivo?")){{delete window._adminUploads[id];render();}}};

window.deleteItem=(idx)=>{if(confirm("Excluir esta peça?")){{content.splice(idx,1);render();}}};
window.updateType=(idx,type)=>{content[idx].type=type;if(type==="carousel"&&!content[idx].slides)content[idx].slides=5;render();};

window.updateTags=(idx,val)=>{content[idx].tags=val.split(",").map(t=>t.trim()).filter(Boolean);};

render();
}

async function renderClient(client){document.getElementById("pageTitle").textContent=`Aprovação — ${client.name}`;const content=await getData(`content_${client.id}`)||[];if(!content.length){document.getElementById("app").innerHTML=`<div style="padding:60px 40px;text-align:center;font-family:'Space Grotesk',sans-serif;max-width:500px;margin:0 auto;color:#f0eff8"><div style="font-size:48px;margin-bottom:20px">📭div><h2 style="font-family:'Syne',sans-serif;font-size:28px;margin-bottom:12px">Nenhum conteúdo disponível</h2><p style="color:#7a7a8a;line-height:1.6">O administrador ainda não criou conteúdos para aprovação.</p></div>`;return;}document.getElementById("dynamicStyles").textContent=`*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Space Grotesk',sans-serif;background:#0c0c0f;color:#f0eff8;min-height:100vh}:root{--acc:${client.color};--acc-dim:${client.colorDim}}header{padding:0 48px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:rgba(12,12,15,.85);backdrop-filter:blur(24px);border-bottom:1px solid #26262f}.hero{padding:52px 48px 40px;border-bottom:1px solid #26262f}.h-title{font-family:'Syne',sans-serif;font-size:42px;font-weight:800;margin-bottom:10px}.h-title em{color:var(--acc);font-style:normal}.cards{padding:20px 48px 120px;display:flex;flex-direction:column;gap:12px}.card{background:#18181f;border:1px solid #26262f;border-radius:16px;overflow:hidden;padding:22px 26px}.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .18s;font-family:'Space Grotesk',sans-serif}.bok{background:rgba(61,186,114,.12);border-color:rgba(61,186,114,.25);color:#3dba72}.bok:hover{background:#3dba72;color:#0c0c0f}.bed{background:rgba(224,160,48,.12);border-color:rgba(224,160,48,.25);color:#e0a030}.bed:hover{background:#e0a030;color:#0c0c0f}.bno{background:rgba(224,85,85,.12);border-color:rgba(224,85,85,.2);color:#e05555}.bno:hover{background:#e05555;color:#fff}.bbar{position:fixed;bottom:0;left:0;right:0;background:rgba(12,12,15,.94);backdrop-filter:blur(24px);border-top:1px solid #26262f;padding:14px 48px;display:flex;align-items:center;justify-content:space-between;transform:translateY(100%);transition:transform .4s;z-index:200}.bbar.show{transform:translateY(0)}.sbtn{padding:11px 28px;background:var(--acc);border:none;border-radius:10px;font-weight:600;font-size:14px;color:#0c0c0f;cursor:pointer;font-family:'Space Grotesk',sans-serif}`;const KEY=`aprovai_${client.id}`,TOTAL=content.length,state={statuses:{},comments:{}};const saved=await getData(KEY);if(saved){if(saved.statuses)Object.entries(saved.statuses).forEach(([k,v])=>state.statuses[k]=v);if(saved.comments)Object.entries(saved.comments).forEach(([k,v])=>state.comments[k]=v);}const cardsHtml=content.map((item,idx)=>{const i=idx+1,st=state.statuses[i]||"pending",cm=state.comments[i]||"";return `<div class="card" id="c${i}"><div style="margin-bottom:18px"><strong>#${i} ${item.title||""}</strong></div><div style="margin-bottom:16px;color:#c8c7d4">${item.copy||""}</div><textarea id="cm${i}" placeholder="Comentário (opcional)" style="width:100%;padding:10px;border:1px solid #26262f;border-radius:8px;background:#0c0c0f;color:#f0eff8;font-family:'Space Grotesk',sans-serif;margin-bottom:12px;min-height:60px">${cm}</textarea><div style="display:flex;gap:8px"><button class="btn bok ${st==="approved"?"on":""}" onclick="window.setS(${i},'approved')">✓ Aprovar</button><button class="btn bed ${st==="edited"?"on":""}" onclick="window.setS(${i},'edited')">✏ Editar</button><button class="btn bno ${st==="rejected"?"on":""}" onclick="window.setS(${i},'rejected')">✕ Reprovar</button></div></div>`;}).join("");const firstName=client.name.split(" ").slice(-1)[0];document.getElementById("app").innerHTML=`<header><div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700">${client.name}</div></header><div class="hero"><div class="h-title">Olá, <em>${firstName}</em></div><p style="font-size:14px;color:#7a7a8a">Revise as peças preparadas para você. Aprove, solicite edições ou deixe seu comentário.</p></div><div class="cards">${cardsHtml}</div><div class="bbar" id="bbar"><div style="font-size:13px;color:#7a7a8a"><strong id="bc">0 de ${TOTAL}</strong> revisados</div><button class="sbtn" onclick="window.submitAll()">Enviar respostas</button></div>`;for(let i=1;i<=TOTAL;i++){const el=document.getElementById(`cm${i}`);if(el)el.addEventListener("input",function(){const id=this.id.replace("cm","");if(this.value.trim())state.comments[id]=this.value.trim();else delete state.comments[id];persist();});}async function persist(){await saveData(KEY,{statuses:state.statuses,comments:state.comments});updateBar();}function updateBar(){const rev=Object.keys(state.statuses).length;document.getElementById("bc").textContent=`${rev} de ${TOTAL}`;document.getElementById("bbar").classList.toggle("show",rev>0);}window.setS=(i,s)=>{state.statuses[i]=s;persist();};window.submitAll=async()=>{state.submitted=true;await saveData(KEY,{statuses:state.statuses,comments:state.comments,submitted:true});alert("🎉 Enviado! Obrigado pela rapidez.");};updateBar();}
</script>
</body>
